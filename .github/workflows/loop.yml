name: Autonomous Blog Loop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  run-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run autonomous loop
        id: loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: |
          python3 src/main.py --run

      - name: Upload state and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-state-${{ github.run_number }}
          path: |
            automation/state.json
            automation/checkpoints/
            automation/logs/
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-logs-${{ github.run_number }}
          path: automation/logs/
          retention-days: 30

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Autonomous Blog Loop Failed - Run #${{ github.run_number }}',
              body: 'The autonomous blog loop workflow failed. Check the artifacts for state and logs.\n\nRun: #${{ github.run_number }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}',
              labels: ['automation', 'bug']
            })
